name: Fork - Album checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - run: python3 .github/scripts/test_fork_release.py
      - run: |
          chmod +x gradlew
          ./gradlew -PFORK_FOCUSED_TESTS :app:verifyNgDesignSystem :app:testAppDebugUnitTest --tests '*NgCoverAlbumStoreTest' --tests '*AppUpdateReleaseTest' --tests '*NgContentThemePackageTest' --tests '*NgThemeDrawerPackageTest' --stacktrace
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fork-test-reports
          path: app/build/reports/tests
