name: Fork - Follow upstream release

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Build even when the upstream release has not changed
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: fork-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'Guany725/legado_NG' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Prepare candidate from upstream stable tag
        id: candidate
        env:
          FORCE: ${{ inputs.force || false }}
        run: |
          if [ "$FORCE" = true ]; then
            python3 .github/scripts/fork_release.py prepare --force
          else
            python3 .github/scripts/fork_release.py prepare
          fi
      - name: Require persistent release signing key
        if: steps.candidate.outputs.changed == 'true'
        env:
          KEY: ${{ secrets.RELEASE_KEY_STORE }}
          ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.RELEASE_KEY_PASSWORD }}
          STORE_PASS: ${{ secrets.RELEASE_STORE_PASSWORD }}
        run: |
          if [ -z "$KEY" ] || [ -z "$ALIAS" ] || [ -z "$KEY_PASS" ] || [ -z "$STORE_PASS" ]; then
            echo 'Configure the four RELEASE_* secrets described in docs/FORK_ALBUMS.md before publishing.' >&2
            exit 1
          fi
          printf '%s' "$KEY" | base64 --decode > "$RUNNER_TEMP/fork-signing.p12"
      - uses: actions/setup-java@v5
        if: steps.candidate.outputs.changed == 'true'
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
        if: steps.candidate.outputs.changed == 'true'
      - name: Install build tools used for signature verification
        if: steps.candidate.outputs.changed == 'true'
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Test and build the candidate
        if: steps.candidate.outputs.changed == 'true'
        env:
          ORG_GRADLE_PROJECT_RELEASE_STORE_FILE: ${{ runner.temp }}/fork-signing.p12
          ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_FORK_VERSION_NAME: ${{ steps.candidate.outputs.version }}
          ORG_GRADLE_PROJECT_FORK_VERSION_CODE: ${{ steps.candidate.outputs.version_code }}
        run: |
          python3 .github/scripts/test_fork_release.py
          chmod +x gradlew
          ./gradlew -PFORK_FOCUSED_TESTS :app:verifyNgDesignSystem :app:testAppDebugUnitTest --tests '*NgCoverAlbumStoreTest' --tests '*AppUpdateReleaseTest' --tests '*NgContentThemePackageTest' --tests '*NgThemeDrawerPackageTest' --stacktrace
          ./gradlew :app:assembleAppRelease -PUPDATE_CHANNEL=official --stacktrace
          mkdir -p apk
          mapfile -t files < <(find app/build/outputs/apk/app/release -name '*.apk')
          [ "${#files[@]}" -eq 1 ]
          cp "${files[0]}" "apk/legado_NG_${{ steps.candidate.outputs.version_long }}_release.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose apk/*.apk
      - uses: actions/upload-artifact@v7
        if: steps.candidate.outputs.changed == 'true'
        with:
          name: fork-signed-apk
          path: apk/*.apk
          if-no-files-found: error
      - name: Promote tested candidate and publish
        if: steps.candidate.outputs.changed == 'true'
        env:
          BASE_SHA: ${{ steps.candidate.outputs.base }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.candidate }}
        run: python3 .github/scripts/fork_release.py publish
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/fork-signing.p12"
