// Keep fork identity and CI version overrides separate from upstream build settings.
android {
    defaultConfig {
        applicationId 'io.legado.app.ng.guany725'
        buildConfigField 'String', 'FORK_RELEASE_OWNER', '"Guany725"'
        if (project.hasProperty('FORK_VERSION_NAME')) versionName project.property('FORK_VERSION_NAME').toString()
        if (project.hasProperty('FORK_VERSION_CODE')) versionCode project.property('FORK_VERSION_CODE').toString().toInteger()
    }
    buildTypes.configureEach {
        manifestPlaceholders.put('app_name', '阅读 NG 图集')
    }
}

// Upstream's unrelated unit tests currently do not compile; CI validates this feature's suite.
if (project.hasProperty('FORK_FOCUSED_TESTS')) {
    def focusedDir = layout.buildDirectory.dir('fork-tests')
    def prepareFocusedTests = tasks.register('prepareForkTests', Sync) {
        from('src/test/java') {
            include '**/NgCoverAlbumStoreTest.kt', '**/AppUpdateReleaseTest.kt',
                    '**/NgContentThemePackageTest.kt', '**/NgThemeDrawerPackageTest.kt',
                    '**/NgThemeTestFixtures.kt'
        }
        into(focusedDir)
    }
    android.sourceSets.test.java.setSrcDirs([focusedDir])
    kotlin.sourceSets.getByName('test').kotlin.setSrcDirs([focusedDir])
    tasks.matching { it.name.contains('UnitTest') }.configureEach {
        dependsOn(prepareFocusedTests)
    }
}
